name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: |
          ruff check ./core-api
          ruff check ./ai-service
  test_core_api:
    name: Test Core API
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Building .env file
        run: |
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> ./core-api/.env
          echo "AI_SERVICE_URL=http://localhost:8000" >> ./core-api/.env
          echo "BACKEND_URL=http://localhost:8001" >> ./core-api/.env
          echo "FRONTEND_URL=http://localhost:3000" >> ./core-api/.env
          echo "GOOGLE_CREDENTIALS_JSON=${{secrets.GOOGLE_CREDENTIALS_JSON}}" >> ./core-api/.env
          echo "MAIL_FROM=${{secrets.MAIL_FROM}}" >> ./core-api/.env
          echo "MAIL_FROM_NAME=${{secrets.MAIL_FROM_NAME}}" >> ./core-api/.env
          echo "MAIL_PASSWORD=${{secrets.MAIL_PASSWORD}}" >> ./core-api/.env
          echo "MAIL_PORT=${{secrets.MAIL_PORT}}" >> ./core-api/.env
          echo "MAIL_SERVER=${{secrets.MAIL_SERVER}}" >> ./core-api/.env
          echo "MAIL_USERNAME=${{secrets.MAIL_USERNAME}}" >> ./core-api/.env
          echo "NGROK_AUTHTOKEN=${{secrets.NGROK_AUTHTOKEN}}" >> ./core-api/.env
          echo "SECRET_KEY=${{secrets.SECRET_KEY}}" >> ./core-api/.env
      - name: Install dependencies & Run Tests
        working-directory: ./core-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
          pytest
  test_ai_service:
    needs: lint
    name: Test AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Creare fisier .env pentru AI Service
        run: |
          # echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> ./ai-service/.env
          # Adauga aici alte secrete specifice serviciului de AI
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> ./ai-service/.env
          echo "AI_SERVICE_URL=http://localhost:8000" >> ./ai-service/.env
          echo "BACKEND_URL=http://localhost:8001" >> ./ai-service/.env
          echo "FRONTEND_URL=http://localhost:3000" >> ./ai-service/.env
          echo "GOOGLE_CREDENTIALS_JSON=${{secrets.GOOGLE_CREDENTIALS_JSON}}" >> ./ai-service/.env
          echo "MAIL_FROM=${{secrets.MAIL_FROM}}" >> ./ai-service/.env
          echo "MAIL_FROM_NAME=${{secrets.MAIL_FROM_NAME}}" >> ./ai-service/.env
          echo "MAIL_PASSWORD=${{secrets.MAIL_PASSWORD}}" >> ./ai-service/.env
          echo "MAIL_PORT=${{secrets.MAIL_PORT}}" >> ./ai-service/.env
          echo "MAIL_SERVER=${{secrets.MAIL_SERVER}}" >> ./ai-service/.env
          echo "MAIL_USERNAME=${{secrets.MAIL_USERNAME}}" >> ./ai-service/.env
          echo "NGROK_AUTHTOKEN=${{secrets.NGROK_AUTHTOKEN}}" >> ./ai-service/.env
          echo "SECRET_KEY=${{secrets.SECRET_KEY}}" >> ./ai-service/.env

      - name: Install dependencies & Run Tests
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
          pytest
  test_frontend:
    needs: lint
    name: Build Check Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
  build_and_push:
    needs: [test_core_api, test_ai_service, test_frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo owner
        id: lowercase
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/crm-frontend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/crm-frontend:${{ github.sha }}

      - name: Build and push Core API
        uses: docker/build-push-action@v5
        with:
          context: ./core-api
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/crm-core-api:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/crm-core-api:${{ github.sha }}

      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/crm-ai-service:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/crm-ai-service:${{ github.sha }}
