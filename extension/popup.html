<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        padding: 14px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        font-weight: 600;
      }
      .ok { background: #16a34a22; color: #16a34a; }
      .warn { background: #ca8a0422; color: #ca8a04; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      input[type="number"] {
        width: 64px;
        padding: 5px 8px;
        border: 1px solid #8884;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 12px; font-size: 12px; line-height: 1.5; }
      .muted { opacity: 0.7; }
      .err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>CRM Lead Scraper <span id="pageBadge" class="badge warn">checking…</span></h1>
    <div class="muted" id="hint">
      Open a LinkedIn Sales Navigator <em>people search</em>, then scrape.
    </div>

    <label for="pages">Pages to scrape (~25 leads each)</label>
    <input id="pages" type="number" min="1" max="10" value="1" />

    <button id="scrapeBtn" disabled>Scrape this search</button>

    <hr style="border:none;border-top:1px solid #8883;margin:16px 0" />

    <div style="font-weight:600;margin-bottom:6px">Autonomous mode</div>
    <div class="muted" style="margin-bottom:6px">
      Paste a Sales Navigator search URL — it scrapes in the background, no need to be on the page.
    </div>
    <label for="autoUrl">Sales Navigator search URL</label>
    <textarea id="autoUrl" rows="3" placeholder="https://www.linkedin.com/sales/search/people?query=..."
      style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #8884;border-radius:6px;background:transparent;color:inherit;font-size:11px;font-family:monospace;resize:none"></textarea>
    <button id="autoBtn" style="margin-top:8px">Auto-scrape from URL</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
