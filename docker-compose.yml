services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: crm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - core-api
    networks:
      - crm-network
    restart: unless-stopped

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: crm-core-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=production
    depends_on:
      db:
       condition: service_healthy
      minio:
        condition: service_started
    networks:
      - crm-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: crm-ai-service
    ports:
      - "8001:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      # Schimba modelul aici: llama3.2:3b (rapid) sau llama3.1:8b (mai bun)
      - OLLAMA_MODEL=llama3.2:3b
    depends_on:
      - ollama
    networks:
      - crm-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    container_name: crm-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crm-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: crm-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - crm-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: crm-grafana
    ports:
      - "3001:3001"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_HTTP_PORT=3001
    networks:
      - crm-network
    restart: unless-stopped


  ollama:
    image: ollama/ollama
    container_name: crm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - crm-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: crm-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - crm-network
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    restart: no
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=gills-skimming-slick.ngrok-free.dev"
      - "crm-core-api:8000" # Use the explicit container name
    ports:
      - "4040:4040"
    links:
      - core-api:crm-core-api
    depends_on:
      - core-api
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge


volumes:
  postgres_data:
  ollama_data:
  minio_data:
