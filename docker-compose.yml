services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - core-api
    networks:
      - crm-network
    restart: unless-stopped

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: crm-core-api
    volumes: # <--- ADAUGĂ RÂNDUL ĂSTA
      - ./core-api:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://crm_user:crm_password@db:5432/crm_db
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: crm-ai-service
    ports:
      - "8001:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      # Schimba modelul aici: llama3.2:3b (rapid) sau llama3.1:8b (mai bun)
      - OLLAMA_MODEL=llama3.2:3b
    depends_on:
      - ollama
    networks:
      - crm-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: crm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - crm-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
